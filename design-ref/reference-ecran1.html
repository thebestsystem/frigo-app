<style id="hermes-fix">
  /* Lisibilité terrain : libellés plus grands, CTA vert contrasté */

<body class="bg-surface text-on-surface antialiased h-[884px] w-full overflow-hidden select-none">
<!-- Container plein écran strictement calibré sans défilement -->
<div class="min-h-[100dvh] w-full max-w-md mx-auto flex flex-col justify-between px-4 py-3 bg-surface">
<!-- Section Entête & Progression -->
<header class="flex-none flex flex-col gap-2">
<!-- Indicateur Hors-Ligne sobre -->
<div class="flex items-center justify-between text-on-surface">
<div class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded bg-surface-container border border-outline-variant">
<span class="w-2 h-2 rounded-full bg-tertiary-container animate-pulse"></span>
<span class="font-label-sm text-label-sm font-bold tracking-wider">HORS-LIGNE</span>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant font-bold">CERFA 15497*04</span>
</div>
<!-- Titre & Indicateur d'étape -->
<div class="flex items-baseline justify-between pt-1">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">1. Équipement</h1>
<span class="font-label-md text-label-md text-on-surface-variant font-bold">Étape 1 sur 3</span>
</div>
<!-- Jauge de progression segmentée 3 blocs -->
<div class="grid grid-cols-3 gap-1.5 w-full pt-0.5">
<div class="h-1.5 bg-primary rounded-full"></div>
<div class="h-1.5 bg-surface-container-highest rounded-full"></div>
<div class="h-1.5 bg-surface-container-highest rounded-full"></div>
</div>
</header>
<!-- Formulaire : Exactement 5 champs de saisie/sélection tactiles -->
<main class="flex-1 flex flex-col justify-start gap-3 mt-1 mb-2">
<!-- Champ 1: Marque -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface font-bold tracking-wide" for="brand">
          1. Marque
        </label>
<div class="relative">
<input autocomplete="off" class="w-full h-12 px-3.5 bg-surface-container-lowest border-2 border-outline text-on-surface font-body-md text-body-md font-semibold rounded focus:border-primary focus:ring-0 focus:outline-none" id="brand" name="brand" placeholder="Ex: Daikin, Carrier..." spellcheck="false" type="text" value="Daikin"/>
</div>
</div>
<!-- Champ 2: Modèle -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface font-bold tracking-wide" for="model">
          2. Modèle
        </label>
<div class="relative">
<input autocomplete="off" class="w-full h-12 px-3.5 bg-surface-container-lowest border-2 border-outline text-on-surface font-body-md text-body-md font-semibold rounded focus:border-primary focus:ring-0 focus:outline-none uppercase" id="model" name="model" placeholder="Ex: RXYQ12T" spellcheck="false" type="text" value="RXYQ12T"/>
</div>
</div>
<!-- Champ 3: Numéro de série -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface font-bold tracking-wide" for="serial">
          3. Numéro de série
        </label>
<div class="relative">
<input autocomplete="off" class="w-full h-12 px-3.5 bg-surface-container-lowest border-2 border-outline text-on-surface font-body-md text-body-md font-semibold rounded focus:border-primary focus:ring-0 focus:outline-none uppercase" id="serial" name="serial" placeholder="Ex: SN-2024-9841" spellcheck="false" type="text" value="SN-2024-9841"/>
</div>
</div>
<!-- Champ 4: Fluide frigorigène (Sélecteur binaire ergonomique) -->
<div class="flex flex-col gap-1">
<span class="font-label-md text-label-md text-on-surface font-bold tracking-wide">
          4. Fluide frigorigène
        </span>
<div class="grid grid-cols-2 gap-2 h-12">
<!-- Option R32 -->
<label class="cursor-pointer relative">
<input checked="" class="peer sr-only" name="fluid_type" type="radio" value="R32"/>
<div class="w-full h-full flex items-center justify-center rounded border-2 border-outline bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm peer-checked:border-primary peer-checked:bg-primary-fixed peer-checked:text-on-primary-fixed peer-checked:font-bold transition-none">
              R32
            </div>
</label>
<!-- Option R410A -->
<label class="cursor-pointer relative">
<input class="peer sr-only" name="fluid_type" type="radio" value="R410A"/>
<div class="w-full h-full flex items-center justify-center rounded border-2 border-outline bg-surface-container-lowest text-on-surface font-headline-sm text-headline-sm peer-checked:border-primary peer-checked:bg-primary-fixed peer-checked:text-on-primary-fixed peer-checked:font-bold transition-none">
              R410A
            </div>
</label>
</div>
</div>
<!-- Champ 5: Charge totale (kg) avec incrémenteurs rapides -->
<div class="flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface font-bold tracking-wide" for="charge_input">
          5. Charge totale (kg)
        </label>
<div class="flex items-center h-12 w-full gap-2">
<!-- Bouton Moins -->
<button aria-label="Diminuer la charge" class="w-14 h-12 flex-none flex items-center justify-center bg-surface-container-lowest border-2 border-outline text-on-surface active:bg-surface-dim active:scale-95 text-2xl font-bold rounded" onclick="adjustCharge(-0.1)" type="button">
            –
          </button>
<!-- Affichage numérique & saisie -->
<div class="flex-1 h-12 relative flex items-center bg-surface-container-lowest border-2 border-outline rounded focus-within:border-primary">
<input class="w-full h-full px-3 text-center bg-transparent border-0 font-data-metric text-data-metric text-on-surface focus:ring-0 focus:outline-none p-0 pr-8" id="charge_input" min="0" name="fluid_charge" step="0.05" type="number" value="4.50"/>
<span class="absolute right-3 font-headline-sm text-headline-sm text-on-surface-variant font-bold pointer-events-none">
              kg
            </span>
</div>
<!-- Bouton Plus -->
<button aria-label="Augmenter la charge" class="w-14 h-12 flex-none flex items-center justify-center bg-surface-container-lowest border-2 border-outline text-on-surface active:bg-surface-dim active:scale-95 text-2xl font-bold rounded" onclick="adjustCharge(0.1)" type="button">
            +
          </button>
</div>
</div>
</main>
<!-- Zone Basse : Bouton pleine largeur Suivant -->
<footer class="flex-none pt-2 pb-2 sticky bottom-0 bg-surface">
<button class="w-full h-14 bg-primary text-on-primary font-label-lg text-label-lg uppercase tracking-wider font-bold rounded flex items-center justify-center gap-2 active:bg-primary-container active:scale-[0.99] transition-transform shadow-none" type="button">
<span>Suivant</span>
<span aria-hidden="true" class="material-symbols-outlined font-bold text-2xl">arrow_forward</span>
</button>
</footer>
</div>
<!-- Micro-script utilitaire pour réglage rapide au doigt -->
<script>
    function adjustCharge(delta) {
      const input = document.getElementById('charge_input');
      let val = parseFloat(input.value) || 0;
      val = Math.max(0, val + delta);
      input.value = val.toFixed(2);
    }
  </script>
